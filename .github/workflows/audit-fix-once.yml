name: One-off dependency remediation

on:
  push:
    branches:
      - agent/patient-journey-eval-ui-2026-10-08
    paths:
      - .github/workflows/audit-fix-once.yml

permissions:
  contents: write

jobs:
  audit-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/patient-journey-eval-ui-2026-10-08
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply non-breaking audit fixes
        run: |
          npm audit fix || true
          npm audit --audit-level=moderate || true
      - name: Verify install, lint, build, and unit tests
        run: |
          npm ci
          npm run lint
          npm run build
          npm run test:unit
      - name: Commit dependency remediation
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes produced"
            exit 0
          fi
          git config user.name "chatgpt-codex-connector[bot]"
          git config user.email "199175422+chatgpt-codex-connector[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: apply non-breaking npm audit fixes [skip ci]"
          git pull --rebase origin agent/patient-journey-eval-ui-2026-10-08
          git push origin HEAD:agent/patient-journey-eval-ui-2026-10-08
